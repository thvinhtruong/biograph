vault:
  path: "/Users/truongvinh/university/tudarmstadt/master/biograph/vault"
  entity_dir: "entities"
  source_dir: "sources"

database:
  path: "./biograph.db"

search:
  bleve_index_path: "./biograph.bleve"
  bleve_confidence_threshold: 0.5
  llm_fallback_enabled: true

activation:
  max_hops: 2
  min_energy: 0.05
  decay_per_hop: 0.7
  max_context_nodes: 20
  max_context_tokens: 6000

plasticity:
  reinforcement_alpha: 0.05
  sigmoid_center: 0.5
  decay_enabled: true
  decay_interval: "24h"

llm:
  # Providers: anthropic | openai | gemini | ollama
  provider: "anthropic"
  model: "claude-haiku-4-5-20251001"
  vlm_model: "claude-haiku-4-5-20251001"
  api_key_env: "ANTHROPIC_API_KEY"   # env var name to read the key from
  max_retries: 3

  # Provider-specific env vars (set whichever you use):
  #   Anthropic → ANTHROPIC_API_KEY
  #   OpenAI    → OPENAI_API_KEY
  #   Gemini    → GEMINI_API_KEY
  #   Ollama    → (none — runs locally on localhost:11434)

  # Gemini example:
  # provider: "gemini"
  # model: "gemini-2.0-flash"
  # vlm_model: "gemini-2.0-flash"

ingestion:
  workers: 8          # concurrent VLM workers (default: num CPU)
  force_vlm: false    # true = send every page to VLM regardless of classifier
